          items:
            $ref: '#/components/schemas/FileMigration'
      additionalProperties: false
    FileMigrationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileMigration'
      additionalProperties: false
    FileUploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [temporaryId, contentType, size]
          properties:
            temporaryId:
              type: string
