openapi: 3.1.1
info:
  title: Modelry Community Core HTTP API
  version: 0.1.0
  description: >-
    Canonical V0.1 HTTP contract for the Modelry Control Plane and Application API.
    Route groups keep the two product planes explicit and share request and error semantics.
servers:
  - url: /
security:
  - OwnerSession: []
  - ServiceAccountAPIKey: []
x-modelry-request-id:
  responseHeader: X-Request-Id
  generatedBy: server for every HTTP request; incoming values are not authoritative
  errorEnvelopeField: error.requestId
  applicationRequestRecord: RequestRecord.requestId
x-modelry-request-record:
  responseHeader: X-Request-Record-Persisted
  scope: every /api/v1 Application response
  values:
    'true': the redacted RequestRecord was durably written before response headers were committed
    'false': the RequestRecord could not be durably written before response headers were committed
  streaming: response byte count and duration are finalized after the response closes; an SSE RequestRecord is initially written before response headers
tags:
  - name: Bootstrap
    description: Read first-run state and establish the initial Owner on a locally authorized Runtime.
  - name: ControlPlaneAuth
    description: Create, inspect, and revoke the Owner management session.
  - name: Runtime
    description: Read Runtime readiness and local storage health diagnostics.
  - name: Collections
    description: Create and inspect Collections and administer their Records.
  - name: SchemaChanges
    description: Save per-Collection schema operations, preview and apply changes, and inspect their history.
  - name: AccessRules
    description: Save, apply, discard, and inspect Collection Access Rule changes.
  - name: Authentication
    description: Manage Auth Collection configuration, App Users, credentials, and their sessions from the Control Plane.
  - name: ServiceAccounts
    description: Manage Service Accounts, permissions, and one-time-revealed API Keys.
  - name: Requests
    description: Read redacted Application RequestRecord metadata and details.
  - name: Audit
    description: Read durable Control Plane security and governance AuditRecords.
  - name: ApplicationRecords
    description: Create, list, read, update, and delete records through the Application Data Plane.
  - name: ApplicationAuth
    description: Register and authenticate App Users and manage their Application Sessions.
  - name: Realtime
    description: Subscribe to authorized, committed Collection Record Events over Server-Sent Events.
  - name: Extensions
    description: Manage Owner-authored lifecycle Extensions and safe Hook Run history.
  - name: Secrets
    description: Manage write-only Project Secrets for explicitly authorized Extensions.
  - name: FileStorage
    description: Configure the File Storage Provider, migrate immutable File objects between Providers, and read File values through Runtime-authorized routes.
  - name: Administrators
    description: Create and manage additional Control Plane Administrators, their Permissions, and their sessions.
  - name: Mail
    description: Configure the Project Mail Provider and inspect durable verification and password reset delivery.
  - name: Automation
    description: Manage signed Webhooks, durable Record Event Hooks, UTC Jobs, and safe Delivery history. Outbound Webhook requests use the stable Delivery ID as Idempotency-Key; Record Event requests also repeat the body Event ID in X-Modelry-Event-Id.
paths:
  '/admin/api/v1/extensions':
    get:
      tags: [Extensions]
      operationId: listExtensions
      summary: List Project Extensions
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Extension metadata; source is available only from the detail endpoint.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    post:
      tags: [Extensions]
      operationId: createExtension
      summary: Create a disabled Extension
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionCreateRequest'
      responses:
        '201':
          description: Created Extension and first active Revision. It is disabled by default.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionDetailResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/extensions/{extensionId}':
    parameters:
      - $ref: '#/components/parameters/ExtensionId'
    get:
      tags: [Extensions]
      operationId: getExtension
      summary: Read Extension configuration
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Extension source and configuration without Secret values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionDetailResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    put:
      tags: [Extensions]
      operationId: replaceExtension
      summary: Replace and validate Extension configuration
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionReplaceRequest'
      responses:
        '200':
          description: Validated configuration and newly activated immutable Revision.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionDetailResponse'
        '409':
          $ref: '#/components/responses/ExtensionBindingConflict'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/extensions/{extensionId}/enable':
    parameters:
      - $ref: '#/components/parameters/ExtensionId'
    post:
      tags: [Extensions]
      operationId: enableExtension
      summary: Enable future Extension invocations
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Extension is enabled. No past events are replayed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionStatusResponse'
        '409':
          $ref: '#/components/responses/ExtensionBindingConflict'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/extensions/{extensionId}/disable':
    parameters:
      - $ref: '#/components/parameters/ExtensionId'
    post:
      tags: [Extensions]
      operationId: disableExtension
      summary: Disable new Extension invocations
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Extension is disabled and unstarted matching intents are cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/extensions/{extensionId}/runs':
    parameters:
      - $ref: '#/components/parameters/ExtensionId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Extensions]
      operationId: listExtensionRuns
      summary: List safe Hook Run history
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Hook Run metadata without inputs, outputs, exceptions, HTTP content or Secrets.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionRunListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/extensions/{extensionId}/runs/{runId}':
    parameters:
      - $ref: '#/components/parameters/ExtensionId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Extensions]
      operationId: getExtensionRun
      summary: Read safe Hook Run details
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Safe Hook Run metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionRunResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/secrets':
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List Secret metadata
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Secret names and configured state only.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Create a write-only Secret
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreateRequest'
      responses:
        '201':
          description: Secret metadata only. The value is never returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/secrets/{secretId}':
    parameters:
      - $ref: '#/components/parameters/SecretId'
    patch:
      tags: [Secrets]
      operationId: renameSecret
      summary: Rename a Secret without reading or replacing its value
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRenameRequest'
      responses:
        '200':
          description: Updated Secret metadata only.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Revoke and delete a Secret
      security:
        - OwnerSession: []
      responses:
        '204':
          description: Secret deleted; referencing Webhooks retain its unavailable ID but become disabled, pending Deliveries are cancelled with secretRevoked, and active request cancellation is best effort. Value is never returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/secrets/{secretId}/value':
    parameters:
      - $ref: '#/components/parameters/SecretId'
    put:
      tags: [Secrets]
      operationId: replaceSecretValue
      summary: Replace a write-only Secret value
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretWriteValueRequest'
      responses:
        '200':
          description: Secret metadata only. The value is never returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/bootstrap/status':
    get:
      tags: [Bootstrap]
      operationId: getBootstrapStatus
      summary: Read bootstrap status
      security: []
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/bootstrap/owner':
    post:
      tags: [Bootstrap]
      operationId: bootstrapOwner
      summary: Create the first Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapOwnerRequest'
      security: []
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Establishes the HttpOnly, SameSite Owner session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapOwnerResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/auth/login':
    post:
      tags: [ControlPlaneAuth]
      operationId: loginOwner
      summary: Create an Owner session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerLoginRequest'
      security: []
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Establishes the HttpOnly, SameSite Owner session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerLoginResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/auth/session':
    get:
      tags: [ControlPlaneAuth]
      operationId: getOwnerSession
      summary: Read the current Owner session
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerSessionResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/auth/logout':
    post:
      tags: [ControlPlaneAuth]
      operationId: logoutOwner
      summary: Revoke the current Owner session
      security:
        - OwnerSession: []
      responses:
        '204':
          description: Operation completed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/runtime/status':
    get:
      tags: [Runtime]
      operationId: getRuntimeStatus
      summary: Read the public Runtime readiness snapshot
      security:
        - OwnerSession: []
        - ServiceAccountAPIKey: []
        - {}
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators':
    get:
      tags: [Administrators]
      operationId: listAdministrators
      summary: List Control Plane Administrators
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Bounded Administrator list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
    post:
      tags: [Administrators]
      operationId: createAdministrator
      summary: Create a Control Plane Administrator
      description: Owner-only. The new Administrator can sign in immediately with the supplied password and holds exactly the supplied Permission.
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorCreateInput'
      responses:
        '201':
          description: Administrator created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    get:
      tags: [Administrators]
      operationId: getAdministrator
      summary: Read one Administrator
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Administrator metadata without credential material.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
    patch:
      tags: [Administrators]
      operationId: updateAdministrator
      summary: Update an Administrator email or Permission
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorUpdateInput'
      responses:
        '200':
          description: Administrator updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
    delete:
      tags: [Administrators]
      operationId: deleteAdministrator
      summary: Delete an Administrator and revoke its sessions
      security:
        - OwnerSession: []
      responses:
        '204':
          description: Administrator deleted.
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}/enable':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    post:
      tags: [Administrators]
      operationId: enableAdministrator
      summary: Enable an Administrator
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Administrator enabled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}/disable':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    post:
      tags: [Administrators]
      operationId: disableAdministrator
      summary: Disable an Administrator and revoke its sessions
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Administrator disabled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}/password':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    post:
      tags: [Administrators]
      operationId: setAdministratorPassword
      summary: Set an Administrator password and revoke its sessions
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorPasswordInput'
      responses:
        '204':
          description: Password set; existing Administrator sessions were revoked.
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}/sessions':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    get:
      tags: [Administrators]
      operationId: listAdministratorSessions
      summary: List Administrator sessions
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Bounded session list without tokens.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSessionListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/administrators/{administratorId}/sessions/revoke-all':
    parameters:
      - $ref: '#/components/parameters/AdministratorId'
    post:
      tags: [Administrators]
      operationId: revokeAdministratorSessions
      summary: Revoke every session of an Administrator
      security:
        - OwnerSession: []
      responses:
        '204':
          description: Sessions revoked.
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/mail':
    get:
      tags: [Mail]
      operationId: getMailProvider
      summary: Read the Project Mail Provider configuration
      description: Owner-only. Credentials are Project Secrets and are never returned as values.
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Mail Provider configuration with Secret metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailProviderResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
    put:
      tags: [Mail]
      operationId: configureMailProvider
      summary: Configure the Project Mail Provider
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailProviderInput'
      responses:
        '200':
          description: Mail Provider configuration saved; the response reports the new revision.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailProviderResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
        default:
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/mail/test':
    post:
      tags: [Mail]
      operationId: testMailProvider
      summary: Send a test message through the Mail Provider
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailTestInput'
      responses:
        '200':
          description: Safe delivery result; SMTP response text and credentials are never returned.
          headers:
            X-Request-Id:
