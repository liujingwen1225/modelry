            application/json:
              schema:
                $ref: '#/components/schemas/EventHookResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/event-hooks/{eventHookId}/enable':
    parameters:
      - $ref: '#/components/parameters/EventHookId'
    post:
