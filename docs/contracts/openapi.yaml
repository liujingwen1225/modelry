      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileStorageProviderTestResult'
      additionalProperties: false
    FileMigrationInput:
      type: object
      required: [targetProvider]
      properties:
        targetProvider:
          type: string
          enum: [local, s3]
