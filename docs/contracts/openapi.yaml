          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHookResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
