                $ref: '#/components/schemas/WebhookStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/webhooks/{webhookId}/disable':
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Automation]
      operationId: disableWebhook
      summary: Disable a Webhook and cancel unstarted Deliveries
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Webhook is disabled; pending Event Hook and Job Deliveries are cancelled, request cancellation is best effort, future Event Hook triggers are skipped, and due slots consumed by enabled Jobs are skipped. A disabled Job retains its due slot and consumes it after it is enabled according to the Webhook state at that time.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
