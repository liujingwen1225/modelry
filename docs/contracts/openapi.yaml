      security:
        - OwnerSession: []
      responses:
        '200':
          description: Event Hook is disabled; accepted Deliveries are unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHookStatusResponse'
