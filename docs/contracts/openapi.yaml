    DeliveryAttempt:
      type: object
      required: [round, attempt, webhookRevision, status, startedAt, durationMs, errorCode]
      properties:
        round:
          type: integer
          minimum: 1
          maximum: 4
        attempt:
          type: integer
          minimum: 1
          maximum: 8
          description: Bounded worker-processing attempt number within the round. One attempt issues zero or one HTTP request; preflight may fail before a request.
        webhookRevision:
          type: integer
          minimum: 1
          description: Webhook configuration revision pinned for this attempt round.
        status:
          type: string
          enum: [running, succeeded, retryScheduled, rejected, failed, interrupted, cancelled]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: Present only when an HTTP response was received. A preflight failure issues no HTTP request.
        errorCode:
          type: string
          enum: [none, capacityExceeded, secretNotAvailable, secretKeyUnavailable, secretRevoked, webhookDisabled, originNotAllowed, externalRequestFailed, deliveryRejected, attemptInterrupted, hookFailed]
      additionalProperties: false
    DeliverySummary:
      type: object
