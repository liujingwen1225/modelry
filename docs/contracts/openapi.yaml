          enum: [field, relation, index]
        action:
          type: string
          enum: [add, update, remove]
        targetId:
          $ref: '#/components/schemas/Id'
        definition:
          type: object
          additionalProperties: true
      additionalProperties: false
    PendingChange:
      type: object
      required: [changeSetId, collectionId, version, status, operations]
      properties:
