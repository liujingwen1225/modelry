            contentType:
              type: string
              description: Server-detected MIME type.
            size:
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false
    RecordListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        nextCursor:
          type: string
    PendingOperationRequest:
      type: object
