              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    post:
      tags: [Automation]
      operationId: createJob
      summary: Create a disabled UTC Cron Job
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '201':
          description: Job was created disabled with a persisted next-run time.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/jobs/{jobId}':
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Automation]
      operationId: getJob
      summary: Read Job configuration
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Job schedule and next-run metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
    put:
      tags: [Automation]
      operationId: replaceJob
      summary: Replace Job schedule and Webhook
      security:
        - OwnerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '200':
          description: Updated UTC schedule and recalculated next-run time.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/jobs/{jobId}/enable':
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Automation]
      operationId: enableJob
      summary: Enable future Job schedule slots
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Job is enabled with a persisted next-run time. A due slot preserved while the Job was disabled creates one catch-up only if the Webhook is enabled when the scheduler consumes it; otherwise it is skipped and advanced.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/jobs/{jobId}/disable':
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Automation]
      operationId: disableJob
      summary: Stop future Job schedule slots
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Job is disabled; an overdue slot is preserved for at most one catch-up after re-enable. Accepted Deliveries are unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/deliveries':
    get:
      tags: [Automation]
      operationId: listDeliveries
      summary: List safe Webhook Delivery history
      security:
        - OwnerSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [eventHook, job, test]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, succeeded, failed, cancelled]
      responses:
        '200':
          description: Bounded Delivery metadata without payload or HTTP content.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/deliveries/{deliveryId}':
    parameters:
      - $ref: '#/components/parameters/DeliveryId'
    get:
      tags: [Automation]
      operationId: getDelivery
      summary: Read safe Delivery and Attempt history
      security:
        - OwnerSession: []
      responses:
        '200':
          description: Safe Delivery metadata and bounded Attempt history without payload.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetailResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
  '/admin/api/v1/deliveries/{deliveryId}/retry':
    parameters:
      - $ref: '#/components/parameters/DeliveryId'
    post:
      tags: [Automation]
      operationId: retryDelivery
      summary: Start a bounded manual Delivery retry round
      security:
        - OwnerSession: []
      responses:
        '202':
          description: The same Delivery and idempotency key were queued for a new attempt round.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '409':
          description: Delivery is not failed, has no payload to redrive, its retry budget is exhausted, or its Webhook is disabled or has no configured signing Secret.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The pending Delivery limit is full. The Delivery and manual redrive count are unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
components:
  securitySchemes:
    OwnerSession:
      type: apiKey
      in: cookie
      name: modelry_admin_session
      description: HttpOnly Owner session cookie created by the Control Plane login operation.
    ServiceAccountAPIKey:
      type: http
      scheme: bearer
      description: One-time-revealed Service Account API Key; authorization still checks Permission.
    ApplicationSession:
      type: http
      scheme: bearer
      description: Opaque, server-revocable Application Session Token.
  headers:
    RequestId:
      description: Canonical server-generated request ID for this HTTP request.
      schema:
        $ref: '#/components/schemas/RequestId'
    RequestRecordPersisted:
      description: Whether a redacted Application RequestRecord was durably written before response headers were committed.
      required: true
      schema:
        type: string
        enum: ['true', 'false']
  parameters:
    AdministratorId:
      name: administratorId
      in: path
      required: true
      schema:
        type: string
        pattern: '^adm_[0-9a-f]{32}$'
    MailDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: '^mail_[0-9a-f]{32}$'
    FileIndex:
      name: fileIndex
      in: path
      required: true
      description: Zero-based position of a File value inside an ordered files Field.
      schema:
        type: integer
        minimum: 0
        maximum: 31
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^fmig_[0-9a-f]{32}$'
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ChangeSetId:
      name: changeSetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CollectionName:
      name: collectionName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        Resume strictly after this Collection-scoped cursor or Event ID. The Collection ID is encoded as unpadded Base64 URL-safe UTF-8 bytes. A cur_ zero position means before the
        first Event; omission starts at the current stream baseline.
      schema:
        $ref: '#/components/schemas/RealtimeResumePosition'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    APIKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ExtensionId:
      name: extensionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EventHookId:
      name: eventHookId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: '^dlv_[a-f0-9]{36}$'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    AuditRecordId:
      name: auditRecordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: >-
        One filter only, in the form `fieldName operator JSON-scalar`. Operators are eq, ne, gt, gte, lt, lte, and contains. The field must be in the Applied Model; contains is text-only, ordered comparisons support text, number, and dateTime, and null supports only eq/ne. Arbitrary SQL is forbidden.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated field keys with optional asc or desc; no SQL expressions.
      schema:
        type: string
    Expand:
      name: expand
      in: query
      required: false
      description: >-
        Comma-separated Applied Relation Field names for one-level expansion on a single Record read.
        Supports at most 10 fields and 100 target Records per field. The original Relation IDs remain
        in the Record fields. Application reads re-evaluate each target Collection View Access Rule;
        a Relation is omitted from _expand if the target is missing or any target is not visible.
      schema:
        type: string
        minLength: 1
        maxLength: 639
  responses:
    StructuredError:
      description: Structured error response with the canonical request ID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ExtensionBindingConflict:
      description: A configured binding is occupied. Details identify the Collection, operation, and phase. The Extension stays disabled or its prior configuration remains active.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApplicationError:
      description: Structured Application error response with the canonical request ID and RequestRecord persistence status.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Request-Record-Persisted:
          $ref: '#/components/headers/RequestRecordPersisted'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RealtimeCapacityReached:
      description: The Runtime has reached its bounded active Realtime connection limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Request-Record-Persisted:
          $ref: '#/components/headers/RequestRecordPersisted'
        Retry-After:
          description: Retry after five seconds.
          required: true
          schema:
            type: string
            const: '5'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      minLength: 1
      description: Opaque stable domain identity; not a SQLite row identifier.
    RequestId:
      type: string
      pattern: '^req_[A-Za-z0-9_-]{8,}$'
      description: Canonical server-generated ID shared by response header, Error and RequestRecord.
    ExtensionCorrelationId:
      type: string
      pattern: '^cor_[a-f0-9]{36}$'
      description: Server-generated correlation identity shared by related Extension Hook Runs.
    RealtimeEventID:
      type: string
      pattern: '^evt_[A-Za-z0-9_-]+_(?!0{20}$)[0-9]{20}$'
      description: Stable Event identity and Collection-scoped order position; the Collection ID is UTF-8 encoded as unpadded Base64 URL-safe text. A nonzero sequence identifies a Record Event. Event IDs are sent only for Events authorized to the subscriber.
    RealtimeEventCursor:
      type: string
      pattern: '^cur_[A-Za-z0-9_-]+_[0-9]{20}$'
      description: Collection-scoped baseline position emitted by stream.ready; the Collection ID is UTF-8 encoded as unpadded Base64 URL-safe text and a zero sequence is the empty boundary before the first Event.
    RealtimeResumePosition:
      description: Last-Event-ID accepts either the current baseline cursor or the most recently received Event ID for the same Collection.
      oneOf:
        - $ref: '#/components/schemas/RealtimeEventCursor'
        - $ref: '#/components/schemas/RealtimeEventID'
    RealtimeStreamReadyEvent:
      type: object
      required: [cursor, collectionId]
      properties:
        cursor:
          $ref: '#/components/schemas/RealtimeEventCursor'
        collectionId:
          $ref: '#/components/schemas/Id'
      additionalProperties: false
    RealtimeRecordEventBase:
      type: object
      required: [eventId, collectionId, recordId, occurredAt, schemaVersion]
      properties:
        eventId:
          $ref: '#/components/schemas/RealtimeEventID'
        collectionId:
          $ref: '#/components/schemas/Id'
        recordId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
          description: UTC mutation timestamp sampled while the Record transaction is active; the Collection Event sequence is authoritative for delivery order.
        schemaVersion:
          type: integer
          minimum: 1
    RealtimeRecordEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeRecordEventBase'
      unevaluatedProperties: false
    RealtimeRecordWithSnapshotEvent:
      allOf:
        - $ref: '#/components/schemas/RealtimeRecordEventBase'
        - type: object
          required: [record]
          properties:
            record:
              $ref: '#/components/schemas/Record'
      unevaluatedProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      additionalProperties: false
    ApiError:
      type: object
      description: For anonymous Runtime or Storage diagnostics, no error field may reveal an absolute Project Root path or secret.
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, BOOTSTRAP_CLOSED, CHANGE_CONFIRMATION_REQUIRED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, VALIDATION_FAILED, REGISTRATION_DISABLED, RATE_LIMITED, EVENT_CURSOR_INVALID, EVENT_CURSOR_EXPIRED, STREAM_CAPACITY_REACHED, STREAM_UNAVAILABLE, ACCESS_RULE_UNAVAILABLE, STORAGE_UNAVAILABLE, STORAGE_BUSY, RUNTIME_NOT_READY, EXTENSION_RUNTIME_UNAVAILABLE, CHANGE_REJECTED_BY_EXTENSION, EXTENSION_BUDGET_EXCEEDED, BINDING_CONFLICT, SECRET_KEY_UNAVAILABLE, SECRET_NOT_AVAILABLE, ORIGIN_NOT_ALLOWED, INTERNAL_ERROR]
        message:
          type: string
          description: Human-readable message without stack traces, SQL, credentials, sensitive body content, or anonymous diagnostic paths.
        details:
          $ref: '#/components/schemas/ErrorDetails'
        hint:
          type: string
          description: Optional safe action; anonymous diagnostic hints omit absolute Project Root paths and secrets.
        requestId:
          $ref: '#/components/schemas/RequestId'
      additionalProperties: false
    ErrorDetails:
      type: object
      description: Structured details; anonymous diagnostic error details must omit absolute Project Root paths and secrets.
      properties:
        collectionId:
          $ref: '#/components/schemas/Id'
        operation:
          type: string
          enum: [create, update, delete]
          description: Occupied Extension Binding operation.
        phase:
          type: string
          enum: [before, afterCommit]
          description: Occupied Extension Binding phase.
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
      additionalProperties: true
    Violation:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    BootstrapStatusResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [required, closed]
    BootstrapOwnerRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      additionalProperties: false
    BootstrapOwnerResponse:
      type: object
      required: [owner, session]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        session:
          $ref: '#/components/schemas/OwnerSession'
    OwnerLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false
    OwnerLoginResponse:
      type: object
      required: [owner, session]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        session:
          $ref: '#/components/schemas/OwnerSession'
      description: Sets the modelry_admin_session HttpOnly cookie; no raw credential is returned.
    Owner:
      type: object
      required: [id, email]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
      additionalProperties: false
    OwnerSessionResponse:
      type: object
      required: [owner, expiresAt]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        expiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [owner, administrator]
        permission:
          $ref: '#/components/schemas/AdministratorPermission'
    OwnerSession:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
    RuntimeStatusResponse:
      type: object
      description: Safe readiness snapshot; never includes the Project Root absolute path or secrets.
      required: [state, observedAt, database, localStorage]
      properties:
        state:
          type: string
          enum: [starting, ready, degraded, unavailable, stopping]
        observedAt:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/Health'
        localStorage:
          $ref: '#/components/schemas/Health'
        projectSource:
          type: string
          description: Identifies flag, environment, or working-directory selection without returning its value or any path.
        version:
          type: string
      additionalProperties: false
    StorageStatusResponse:
      type: object
      description: Safe storage snapshot; the localStorage path is omitted unless the request has valid diagnostic authorization.
      required: [database, localStorage, fileStorage]
      properties:
        database:
          $ref: '#/components/schemas/Health'
        localStorage:
          $ref: '#/components/schemas/LocalStorageHealth'
        fileStorage:
          $ref: '#/components/schemas/FileStorageHealth'
      additionalProperties: false
    LocalStorageHealth:
      type: object
      description: Contains the absolute Local Storage path only for a request authenticated and authorized to read diagnostics.
      required: [state, provider]
      properties:
        state:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        message:
          type: string
          description: Safe diagnostic text; must not include an absolute Project Root path or secret.
        hint:
          type: string
          description: Safe actionable guidance; must not include an absolute Project Root path or secret.
        provider:
          const: Local
        path:
          type: string
          description: Omitted for anonymous requests; returned only when Owner or Service Account Permission authorizes diagnostic path access.
      additionalProperties: false
    Health:
      type: object
      description: Safe diagnostic health; message and hint never include an absolute Project Root path or secret.
      required: [state]
      properties:
        state:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        message:
          type: string
        hint:
          type: string
      additionalProperties: false
    CollectionCreateRequest:
      type: object
      required: [name, type, fields]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          enum: [Normal, Auth]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
        authentication:
          $ref: '#/components/schemas/AuthenticationConfiguration'
        accessRules:
          type: array
          items:
            $ref: '#/components/schemas/AccessRule'
      additionalProperties: false
    FieldDefinition:
      type: object
      required: [name, type]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum: [text, number, boolean, dateTime, json, relation, file, files]
        required:
          type: boolean
        unique:
          type: boolean
        description:
          type: string
        validation:
          type: object
          additionalProperties: true
        default:
          description: Product default value; never raw SQL or a database expression.
        relation:
          type: object
          additionalProperties: true
        system:
          type: boolean
          readOnly: true
      additionalProperties: false
    Collection:
      type: object
      required: [id, name, type, fields]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [Normal, Auth]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    CollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Collection'
    CollectionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionListItem'
        nextCursor:
          type: string
    CollectionListItem:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            recordCount:
              type: integer
              format: int64
              minimum: 0
              description: Included only when the caller has the records.read Permission.
            pendingChangeStatus:
              type: string
              enum: [ready, needsReview, failed]
              description: Included only when the caller has schema.read and an active durable Schema Pending Change exists; omitted when no active change exists.
    RecordWriteRequest:
      type: object
      description: Dynamic Field values; id, createdAt and updatedAt are Runtime-managed and rejected on write.
      properties:
        values:
          type: object
          additionalProperties: true
      required: [values]
      additionalProperties: false
    Record:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _expand:
          type: object
          description: Optional one-level Relation expansion. It never replaces the source Relation IDs.
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/ExpandedRecord'
              - type: array
                items:
                  $ref: '#/components/schemas/ExpandedRecord'
              - type: 'null'
      additionalProperties: true
    ExpandedRecord:
      type: object
      description: Related Record fields without recursive _expand data.
      required: [id, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    RecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Record'
    FileStorageHealth:
      type: object
      description: Provider-neutral File Storage health reported in the Runtime status snapshot.
      required: [state, provider, activeProvider]
      properties:
        state:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        provider:
          type: string
          enum: [Local, S3-compatible]
        activeProvider:
          type: string
          enum: [local, s3]
        message:
          type: string
          description: Safe diagnostic text; never contains credentials, object references, or an absolute path.
        hint:
          type: string
          description: Safe actionable guidance; never contains credentials.
      additionalProperties: false
    StorageSecretReference:
      type: object
      description: Write-only Project Secret reference metadata. The Secret value is never returned by any File Storage response.
      required: [secretId, name, configured]
      properties:
        secretId:
          type: string
          pattern: '^sec_[0-9a-f]{32}$'
        name:
          type: string
        configured:
          type: boolean
      additionalProperties: false
    LocalFileStorageConfiguration:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Owner-only absolute staging directory and Local object directory. Omitted from every non-Owner response.
      additionalProperties: false
    S3FileStorageInput:
      type: object
      description: S3-compatible Provider settings supplied by the Owner. Credentials are Project Secret references, never values.
      required: [endpoint, region, bucket, accessKeySecretId, secretKeySecretId]
      properties:
        endpoint:
          type: string
          description: HTTPS endpoint, or HTTP only for a loopback, private, or link-local host. Must not contain user information, a query, or a fragment.
        region:
          type: string
          minLength: 1
          maxLength: 64
        bucket:
          type: string
          minLength: 1
          maxLength: 63
        keyPrefix:
          type: string
          maxLength: 128
        pathStyle:
          type: boolean
          default: true
        accessKeySecretId:
          type: string
          pattern: '^sec_[0-9a-f]{32}$'
        secretKeySecretId:
          type: string
          pattern: '^sec_[0-9a-f]{32}$'
        sessionTokenSecretId:
          type: string
          pattern: '^sec_[0-9a-f]{32}$'
      additionalProperties: false
    S3FileStorageConfiguration:
      type: object
      description: S3-compatible Provider settings without credential values.
      required: [endpoint, region, bucket, keyPrefix, pathStyle, configured]
      properties:
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        keyPrefix:
          type: string
        pathStyle:
          type: boolean
        configured:
          type: boolean
        accessKey:
          $ref: '#/components/schemas/StorageSecretReference'
        secretKey:
          $ref: '#/components/schemas/StorageSecretReference'
        sessionToken:
          $ref: '#/components/schemas/StorageSecretReference'
      additionalProperties: false
    FileStorageConfiguration:
      type: object
      required: [provider, local]
      properties:
        provider:
          type: string
          enum: [local, s3]
        local:
          $ref: '#/components/schemas/LocalFileStorageConfiguration'
        s3:
          oneOf:
            - $ref: '#/components/schemas/S3FileStorageConfiguration'
            - type: 'null'
      additionalProperties: false
    FileMigration:
      type: object
      description: Durable Provider migration state. Object references are never listed individually.
      required: [id, sourceProvider, targetProvider, status, totalObjects, copiedObjects, startedAt]
      properties:
        id:
          type: string
          pattern: '^fmig_[0-9a-f]{32}$'
        sourceProvider:
          type: string
          enum: [local, s3]
        targetProvider:
          type: string
          enum: [local, s3]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        totalObjects:
          type: integer
          minimum: 0
        copiedObjects:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        finishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        errorCode:
          type: string
          enum: [providerUnavailable, credentialUnavailable, objectWriteFailed, verificationFailed, cancelled, interrupted]
        message:
          type: string
          description: Safe actionable text; never contains credentials or object content.
        targetEndpointHost:
          type: string
        targetBucket:
          type: string
        targetKeyPrefix:
          type: string
      additionalProperties: false
    FileStorageStatus:
      type: object
      required: [activeProvider, provider, revision, providerState, configuration, health]
      properties:
        activeProvider:
          type: string
          enum: [local, s3]
        provider:
          type: string
          enum: [Local, S3-compatible]
        revision:
          type: integer
          minimum: 1
        providerState:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        providerMessage:
          type: string
        providerHint:
          type: string
        configuration:
          $ref: '#/components/schemas/FileStorageConfiguration'
        health:
          type: object
          required: [state, observedAt]
          properties:
            state:
              type: string
              enum: [ready, degraded, unavailable, unknown]
            message:
              type: string
            hint:
              type: string
            observedAt:
              type: string
              format: date-time
            referencedObjects:
              type: integer
              minimum: 0
          additionalProperties: false
        migration:
          type: object
          required: [active]
          properties:
            active:
              type: boolean
            latest:
              oneOf:
                - $ref: '#/components/schemas/FileMigration'
                - type: 'null'
          additionalProperties: false
      additionalProperties: false
    FileStorageStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileStorageStatus'
      additionalProperties: false
    FileStorageProviderInput:
      type: object
      required: [expectedRevision, provider]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        provider:
          type: string
          enum: [local, s3]
        s3:
          $ref: '#/components/schemas/S3FileStorageInput'
      additionalProperties: false
    FileStorageProviderTestInput:
      type: object
      required: [s3]
      properties:
        s3:
          $ref: '#/components/schemas/S3FileStorageInput'
      additionalProperties: false
    FileStorageProviderTestResult:
