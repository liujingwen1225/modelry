      - name: fieldName
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags: [ApplicationRecords]
      operationId: readApplicationRecordFile
      summary: Read an Application File Field
      description: The Applied Collection view Access Rule is enforced. The Runtime reads only the opaque durable reference bound to this Record and returns the file as a private, no-store attachment with nosniff.
      parameters:
        - $ref: '#/components/parameters/CollectionName'
        - $ref: '#/components/parameters/RecordId'
        - name: fieldName
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      security:
        - ApplicationSession: []
        - {}
      x-modelry-access-rule:
        operation: view
      responses:
        '200':
          description: Bound file content with the server-detected safe MIME type.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              description: Always attachment; user supplied filenames are not used as paths.
              schema:
                const: attachment
            X-Content-Type-Options:
              description: Always nosniff.
              schema:
                const: nosniff
            Cache-Control:
              description: Always private, no-store.
              schema:
                const: private, no-store
            Content-Length:
              schema:
                type: integer
                minimum: 0
            X-Request-Record-Persisted:
              $ref: '#/components/headers/RequestRecordPersisted'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '4XX':
          $ref: '#/components/responses/ApplicationError'
        '5XX':
          $ref: '#/components/responses/ApplicationError'
        default:
          $ref: '#/components/responses/ApplicationError'
