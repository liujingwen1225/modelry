          enum: [list, view, create, update, delete]
        mode:
          type: string
          enum: [noAccess, anyone, signedInUsers, recordOwner, custom]
        ownerFieldId:
          $ref: '#/components/schemas/Id'
        expression:
          type: object
          description: >-
            Custom rules use version 1 only: all predicates are ANDed. Each
            predicate compares a non-system Applied Field with a JSON value
            matching that field's type. Arbitrary SQL and unknown expression
            properties are rejected; unsupported or corrupted applied rules
            deny access.
          required: [version, all]
          properties:
            version:
              type: integer
              const: 1
            all:
              type: array
              minItems: 1
              maxItems: 16
              items:
                type: object
                required: [fieldId, operator, value]
                properties:
                  fieldId:
                    $ref: '#/components/schemas/Id'
                  operator:
                    type: string
                    enum: [eq, neq, in]
                  value:
                    description: >-
                      A JSON value compatible with the referenced Applied
                      Field. For in, provide an array of 1 to 32 compatible
                      values. Null compares only to a null field value.
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
