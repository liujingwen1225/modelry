        eventType:
          type: string
          enum: [record.created, record.updated, record.deleted, job.scheduled, webhook.test]
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        attemptCount:
          type: integer
          minimum: 0
          maximum: 32
        manualRedriveCount:
          type: integer
          minimum: 0
          maximum: 3
        lastHttpStatus:
          type: integer
          minimum: 100
          maximum: 599
        errorCode:
          type: string
          enum: [none, capacityExceeded, secretNotAvailable, secretKeyUnavailable, secretRevoked, webhookDisabled, originNotAllowed, externalRequestFailed, deliveryRejected, attemptInterrupted, hookFailed]
      additionalProperties: false
