    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Automation]
      operationId: testWebhook
      summary: Send a signed synthetic test Delivery
      security:
        - OwnerSession: []
      responses:
        '202':
          description: Test Delivery was persisted for bounded asynchronous processing. If capacity is exhausted, this returns a terminal capacityExceeded Delivery without a payload or network request. It may send while the Webhook is disabled if the signing Secret is available; Secret revocation cancels it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '4XX':
          $ref: '#/components/responses/StructuredError'
        '5XX':
          $ref: '#/components/responses/StructuredError'
