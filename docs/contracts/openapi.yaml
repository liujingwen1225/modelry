  '/api/v1/{collectionName}/events':
    parameters:
      - $ref: '#/components/parameters/CollectionName'
    get:
      tags: [Realtime]
      operationId: subscribeToCollectionRecordEvents
      summary: Subscribe to Collection Record Events
      description: >-
        Opens a long-lived Server-Sent Events response for one Collection. A supplied Application Session and
        current Collection-level List admission are revalidated before each Event and at each heartbeat; the
        current per-Record List rule is enforced for every Event. Without Last-Event-ID, stream.ready establishes
        a current baseline;
        with a retained cursor, Events resume strictly after it. A cursor outside the bounded retention window
        returns EVENT_CURSOR_EXPIRED so the client can reload current Records and open a fresh stream.
      parameters:
        - $ref: '#/components/parameters/CollectionName'
        - $ref: '#/components/parameters/LastEventID'
      security:
        - ApplicationSession: []
        - {}
      x-modelry-access-rule:
        operation: list
        evaluation: collection-on-open-event-and-heartbeat; each-event-record
        appliedRulesOnly: true
        reevaluateOnDelivery: true
      x-modelry-realtime:
        eventIdFormat: evt_ followed by the Collection ID UTF-8 bytes in unpadded Base64 URL-safe encoding, an underscore, and a nonzero 20-digit zero-padded decimal sequence
        cursorFormat: cur_ followed by the Collection ID UTF-8 bytes in unpadded Base64 URL-safe encoding, an underscore, and the 20-digit zero-padded Collection sequence position; zero is the empty stream boundary
        cursorScope: the Collection resolved from collectionName in the request path
        ordering: Record mutation commit order within the requested Collection; no cross-Collection total order is exposed
        retention:
          scope: project
          maximumEvents: 10000
          maximumBytes: 67108864
          maximumSingleEventBytes: 1048576
          maximumReplayPageBytes: 1048576
          maximumConcurrentReplayPages: 8
          crossCollectionRetentionPressure: accepted; events in another Collection may shorten this replay window and reveal retention pressure only
        heartbeatSeconds: 15
        maximumConnections: 64
        writeDeadlineSeconds: 5
        eventNames: [stream.ready, record.created, record.updated, record.deleted, record.removed]
      responses:
        '200':
          description: >-
            Long-lived SSE stream. `record.created` and `record.updated` carry an authorized Record snapshot;
            `record.deleted` and `record.removed` carry only identity and event metadata. SSE comments are heartbeats.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Request-Record-Persisted:
              $ref: '#/components/headers/RequestRecordPersisted'
            Cache-Control:
              description: Realtime stream responses are not stored by clients or shared caches.
              schema:
                const: no-store
                type: string
          content:
            text/event-stream:
              schema:
                description: Complete response body encoded as Server-Sent Events text. Each named event's JSON data payload is defined by the matching entry in x-modelry-sse-events.
                type: string
              x-modelry-sse-events:
                stream.ready:
                  idField: cursor
                  payload:
                    $ref: '#/components/schemas/RealtimeStreamReadyEvent'
                record.created:
                  idField: eventId
                  payload:
                    $ref: '#/components/schemas/RealtimeRecordWithSnapshotEvent'
                record.updated:
                  idField: eventId
                  payload:
                    $ref: '#/components/schemas/RealtimeRecordWithSnapshotEvent'
                record.deleted:
                  idField: eventId
                  payload:
                    $ref: '#/components/schemas/RealtimeRecordEvent'
                record.removed:
                  idField: eventId
                  payload:
                    $ref: '#/components/schemas/RealtimeRecordEvent'
                heartbeat:
                  frame: comment
                  id: omitted
                  payload: none
              example: |+
